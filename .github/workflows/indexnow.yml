name: IndexNow

# After each successful production deploy (Vercel reports it to GitHub as a
# deployment status), tell IndexNow search engines which pages changed.
on: deployment_status

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Fingerprints from the last successful submission, to submit changed pages only.
      - uses: actions/cache/restore@v6
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-
      - run: node scripts/indexnow.mjs --state .indexnow-state.json
      - uses: actions/cache/save@v6
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
