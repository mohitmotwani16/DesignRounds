<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" />
    <script>
      // Apply the saved colour theme before first paint (see src/theme.js).
      try {
        var choice = localStorage.getItem("designrounds:theme") || "system";
        var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = choice === "system" ? (dark ? "dark" : "light") : choice;
      } catch (error) {}
    </script>
    <meta name="description" content="Practice system design by making decisions, explaining trade-offs, and improving your designs." />
    <title>DesignRounds — Practice system design by doing it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
